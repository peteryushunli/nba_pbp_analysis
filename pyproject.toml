[project]
name = "nba-pbp-analysis"
version = "0.1.0"
description = "NBA play-by-play analysis: eFG%, ORtg/DRtg by game situation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "duckdb>=1.1.0",
    "nba_api>=1.4.0",
    "pandas>=2.0.0",
    "pyarrow>=17.0.0",
    "typer>=0.12.0",
    "tqdm>=4.66.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
nba-pipeline = "backend.pipeline.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
